    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var path = window.location.pathname.replace(/\\/+$/, "") || "/";
        var roleManifests = {
          "/parent": "/parent.webmanifest",
          "/teacher": "/teacher.webmanifest",
          "/admin": "/admin.webmanifest",
          "/admin/dashboard": "/admin.webmanifest",
          "/owner": "/owner.webmanifest",
          "/owner/dashboard": "/owner.webmanifest"
        };
        var manifest = roleManifests[path];
        if (manifest) {
          var link = document.getElementById("app-manifest");
          if (link) link.setAttribute("href", manifest);
        }
      })();
    </script>
