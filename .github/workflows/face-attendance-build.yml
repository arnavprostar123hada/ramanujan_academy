name: Face attendance feature build

on:
  push:
    branches:
      - feature/face-attendance-kiosk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve package manifest and synchronize npm lockfile
        run: npm install --no-audit --no-fund
      - name: Commit lockfile sync on feature branch when required
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile for attendance feature"
            git push origin HEAD:feature/face-attendance-kiosk
          fi
      - name: Verify clean locked installation
        run: npm ci --no-audit --no-fund
      - name: Build application
        run: npm run build
